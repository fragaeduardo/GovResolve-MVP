name: GovResolve MVP checks

on:
  push:
    branches:
      - feat/mvp-security-agent-workflow
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-test-signing-value-32chars-not-for-production
      DEMO_STAFF_ACCESS_CODE: ci-only-demo-staff-access
      DATABASE_URL: sqlite+aiosqlite:///./data/govresolve.db
      AGENT_MEMORY_DIR: ./data/agent_memory
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r infra/requirements.txt
      - name: Run automated tests
        run: python -m pytest -q
      - name: Print offline triage benchmark
        run: python -m scripts.evaluate_triage
