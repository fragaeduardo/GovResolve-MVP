services:
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: govresolve_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-govresolve}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_dotenv}@db:5432/${POSTGRES_DB:-govresolve_db}
      - OMNIROUTE_BASE_URL=${OMNIROUTE_DOCKER_BASE_URL:-http://host.docker.internal:20128/v1}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - agent_memory:/app/data/agent_memory
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: govresolve_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: govresolve_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govresolve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_dotenv}
      POSTGRES_DB: ${POSTGRES_DB:-govresolve_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  agent_memory:
