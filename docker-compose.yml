version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: govresolve_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://govresolve:govresolve@db:5432/govresolve_db
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: govresolve_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: govresolve_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: govresolve
      POSTGRES_PASSWORD: govresolve
      POSTGRES_DB: govresolve_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govresolve -d govresolve_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
